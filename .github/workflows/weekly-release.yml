name: Weekly source release

# The same weekly release as the Kira packages: when the `version` constant
# in Package.swift names the current release week (`YY.month.week`, Europe/Paris, weeks capped at 4)
# and RELEASE.md has a heading for it, the release is created with
# RELEASE.md as its notes. Its tag is the version, which SwiftPM reads as
# a semantic version. Anything else skips.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-source-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release matching version
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Paris
        shell: bash
        run: |
          set -euo pipefail
          # SwiftPM has no version field: the version is a constant in the
          # manifest, and the release's tag is what SwiftPM resolves.
          mapfile -t versions < <(sed -nE 's/^let[[:space:]]+version[[:space:]]*:[[:space:]]*String[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Package.swift | sort -u)
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "Expected one version in Package.swift, found: ${versions[*]}" >&2
            exit 1
          fi
          version="${versions[0]}"
          read -r year month day < <(date "+%y %-m %-d")
          week=$(( (day + 6) / 7 ))
          (( week > 4 )) && week=4
          current="$year.$month.$week"
          if [ "$version" != "$current" ]; then
            echo "Version $version does not match $current; skipping"
            exit 0
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$version")
          case "$status" in
            200) echo "Release $version already exists"; exit 0 ;;
            404) ;;
            *) echo "Could not check release: HTTP $status" >&2; exit 1 ;;
          esac
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$version")
          case "$status" in
            404) ;;
            200) echo "Tag $version exists without a release; refusing to use an unknown commit" >&2; exit 1 ;;
            *) echo "Could not check tag: HTTP $status" >&2; exit 1 ;;
          esac
          if ! grep -Fxq "# $version" RELEASE.md; then
            echo "RELEASE.md must have a heading for $version" >&2
            exit 1
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes-file RELEASE.md
